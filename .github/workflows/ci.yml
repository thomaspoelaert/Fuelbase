name: Checks

# Keep checks separate from image publishing so PR feedback stays fast.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, dev ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: i18n check
        run: npm run i18n:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
