name: Checks

# The repo's other workflow (docker.yml) builds and publishes images; keeping
# checks separate means a red check never blocks an image push and a slow
# multi-arch build never delays PR feedback.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev
      - 'feature/**'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Current Capacitor tooling requires Node >=22. The production Docker
      # runtime remains independently pinned/validated by its own image build.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: i18n check
        run: npm run i18n:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
