<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FuelBase — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0C0F13;
      color: #F5F7F9;
      padding: 24px;
    }
    .card {
      width: min(100%, 390px);
      padding: 28px;
      background: #14181D;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 28px;
      box-shadow: 0 24px 64px rgba(0,0,0,.28);
    }
    .mark {
      width: 46px; height: 46px;
      display: grid; place-items: center;
      margin-bottom: 24px;
      border-radius: 15px;
      background: rgba(79,255,176,.11);
      color: #4FFFB0;
      font-size: 22px;
    }
    .eyebrow {
      display: block;
      margin-bottom: 7px;
      color: #4FFFB0;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    h1 {
      font-size: 25px;
      line-height: 1.15;
      letter-spacing: -.035em;
      margin-bottom: 10px;
    }
    p {
      color: rgba(245,247,249,.62);
      font-size: 14px;
      line-height: 1.65;
      margin-bottom: 22px;
    }
    .btn {
      width: 100%;
      min-height: 46px;
      padding: 0 18px;
      border: 0;
      border-radius: 14px;
      background: #4FFFB0;
      color: #0C0F13;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { filter: brightness(.95); }
    .footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,.07);
      color: rgba(245,247,249,.36);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">↗</div>
    <span class="eyebrow">FuelBase offline</span>
    <h1>Your server is out of reach.</h1>
    <p>Your diary and fueling plan need a connection to the FuelBase server. Check the server or network connection and try again.</p>
    <button class="btn" onclick="window.location.reload()">Try again</button>
    <div class="footer">Endurance nutrition, built around training.</div>
  </main>
</body>
</html>
